<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rendu 3D</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #e5e7eb;
            color: #111827;
            font: 16px system-ui, sans-serif;
        }

        main {
            max-width: 1800px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tabs button {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f9fafb;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .tabs button[aria-selected="true"] {
            border-color: #111827;
            background: #111827;
            color: #f9fafb;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 2.2fr) minmax(300px, 1fr);
            gap: 16px;
            align-items: start;
        }

        .layout[hidden] {
            display: none;
        }

        .sidebar {
            display: grid;
            gap: 16px;
        }

        section {
            min-width: 0;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f9fafb;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 600;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #9ca3af;
            background: #111827;
        }

        .screen {
            background: #141820;
        }

        .view {
            height: 320px;
            overflow: hidden;
            border: 1px solid #9ca3af;
            background: #111827;
        }

        .view canvas {
            width: 100%;
            height: 100%;
        }

        .object-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .object-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #d1d5db;
        }

        .swatch {
            width: 14px;
            height: 14px;
            flex: 0 0 14px;
            border-radius: 50%;
        }

        @media (max-width: 760px) {
            body {
                padding: 16px;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .view {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <main>
        <nav class="tabs" role="tablist">
            <button role="tab" data-page="raytracing">Raytracing</button>
            <button role="tab" data-page="rasterization">Rasterization</button>
            <button role="tab" data-page="projection" aria-selected="true">Projection</button>
        </nav>
        <div id="raytracing" class="layout" hidden>
            <section>
                <h2>Vue caméra</h2>
                <canvas class="screen" width="1280" height="720"></canvas>
            </section>
            <div class="sidebar">
                <section>
                    <h2>Repère 3D</h2>
                    <div class="view"></div>
                </section>
                <section>
                    <h2>Objets</h2>
                    <ul class="object-list"></ul>
                </section>
            </div>
        </div>
        <div id="rasterization" class="layout" hidden>
            <section>
                <h2>Canevas</h2>
                <canvas class="screen" width="1280" height="720"></canvas>
            </section>
            <div class="sidebar">
                <section>
                    <h2>Repère 2D</h2>
                    <div class="view"></div>
                </section>
                <section>
                    <h2>Objets</h2>
                    <ul class="object-list"></ul>
                </section>
            </div>
        </div>
        <div id="projection" class="layout" hidden>
            <section>
                <h2>Canevas</h2>
                <canvas class="screen" width="1280" height="720"></canvas>
            </section>
            <div class="sidebar">
                <section>
                    <h2>Repère 2D</h2>
                    <div class="view"></div>
                </section>
                <section>
                    <h2>Objets</h2>
                    <ul class="object-list"></ul>
                </section>
            </div>
        </div>
    </main>
    <script type="module" src="src/main.js"></script>
</body>
</html>
